<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 14px; background: #0f172a; color: #f8fafc; margin: 0; }
    h4 { margin: 0 0 6px 0; font-size: 15px; color: #38bdf8; }
    p { font-size: 11px; color: #94a3b8; margin-top: 0; margin-bottom: 12px; }
    label { font-size: 11px; color: #cbd5e1; display: block; margin-top: 8px; margin-bottom: 2px; }
    input { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; background: #e60023; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 14px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ad081b; }
    #status { margin-top: 10px; font-size: 11px; text-align: center; word-break: break-word; }
  </style>
</head>
<body>
  <h4>Pinterest AI Automation Sync</h4>
  <p>Connect your Pinterest account & product Drive folder to the Cloud Agent.</p>

  <label for="agentUrl">Live Agent Domain</label>
  <input type="url" id="agentUrl" placeholder="https://your-agent.vercel.app" />

  <label for="gdriveUrl">Google Drive Folder URL</label>
  <input type="url" id="gdriveUrl" placeholder="https://drive.google.com/drive/folders/..." />

  <button id="syncBtn">Sync Session & Drive 🚀</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
