<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 14px; background: #0f172a; color: #f8fafc; margin: 0; }
    h4 { margin-top: 0; margin-bottom: 6px; font-size: 15px; }
    p { font-size: 12px; color: #94a3b8; margin-top: 0; margin-bottom: 12px; }
    label { font-size: 11px; color: #cbd5e1; display: block; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; background: #e60023; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ad081b; }
    #status { margin-top: 10px; font-size: 11px; text-align: center; word-break: break-word; }
  </style>
</head>
<body>
  <h4>Pinterest AI Agent Sync</h4>
  <p>Enter your Vercel URL and click sync while logged in to Pinterest:</p>
  <label for="vercelUrl">Vercel Domain</label>
  <input type="url" id="vercelUrl" placeholder="https://your-app.vercel.app" />
  <button id="syncBtn">Sync Session to Cloud Agent </button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
